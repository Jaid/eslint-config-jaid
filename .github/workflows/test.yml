name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6.0.2
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: install
      run: bun install
    - name: lockfile
      uses: actions/upload-artifact@v4.6.2
      with:
        name: bun-lock
        path: bun.lock
    - name: test
      run: bun run test
    - name: build
      run: bun run build:production
