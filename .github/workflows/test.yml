name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6.0.2
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: install
      run: bun install --frozen-lockfile
    - name: typecheck
      run: bun run tsc
    - name: typecheckFixture
      run: bun x tsc -p test/fixture/clean-ts/tsconfig.json --pretty false
    - name: test
      run: bun run test
    - name: build
      run: bun run build:production
    - name: smokeBuild
      run: |
        test -f dist/eslint-config-jaid/production/lib.js
        test -f dist/eslint-config-jaid/production/lib.d.ts
        test -f dist/eslint-config-jaid/production/package.json
        bun -e "const pkg = await import('./dist/eslint-config-jaid/production/lib.js'); if (!Array.isArray(pkg.makeEslintConfig())) process.exit(1)"
